<!-- Debug Modal for Checking Errors -->
<div class="modal fade" id="debugErrorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Debug: API Error Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label"><strong>Error Message:</strong></label>
                    <textarea id="debugErrorMessage" class="form-control" rows="3" readonly></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>API Endpoint:</strong></label>
                    <input type="text" id="debugEndpoint" class="form-control" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Request Payload:</strong></label>
                    <textarea id="debugPayload" class="form-control" rows="4" readonly></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Full Response:</strong></label>
                    <textarea id="debugFullResponse" class="form-control" rows="5" readonly></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-danger" onclick="copyDebugInfo()">Copy to Clipboard</button>
            </div>
        </div>
    </div>
</div>

<script>
// Enhanced delete functions with detailed error logging
window.debugLastError = null;

function showDebugError(error, endpoint, payload, response) {
    window.debugLastError = {
        error: error,
        endpoint: endpoint,
        payload: payload,
        response: response
    };
    
    document.getElementById('debugErrorMessage').value = error;
    document.getElementById('debugEndpoint').value = endpoint;
    document.getElementById('debugPayload').value = JSON.stringify(payload, null, 2);
    document.getElementById('debugFullResponse').value = JSON.stringify(response, null, 2);
    
    const modal = new bootstrap.Modal(document.getElementById('debugErrorModal'));
    modal.show();
    
    console.error('API Debug:', {error, endpoint, payload, response});
}

function copyDebugInfo() {
    const text = `ERROR: ${window.debugLastError.error}\nENDPOINT: ${window.debugLastError.endpoint}\nPAYLOAD: ${JSON.stringify(window.debugLastError.payload, null, 2)}\nRESPONSE: ${JSON.stringify(window.debugLastError.response, null, 2)}`;
    navigator.clipboard.writeText(text).then(() => {
        alert('Debug info copied to clipboard!');
    });
}

// Wrap deleteProposal with enhanced error handling
const originalDeleteProposal = window.deleteProposal;
window.deleteProposal = async function(proposalId) {
    if (!proposalId) {
        alert('Error: Proposal ID not found');
        return;
    }

    const proposalStatus = document.getElementById('propStatus').textContent;
    if (proposalStatus !== 'Rejected') {
        alert('Proposals can only be deleted if they are Rejected.');
        return;
    }

    const proposalTitle = document.getElementById('propEventName').value;
    
    if (!confirm(`Are you sure you want to delete the proposal "${proposalTitle}"? This action cannot be undone.`)) {
        return;
    }

    try {
        const payload = {
            action: 'delete',
            proposalId: parseInt(proposalId)
        };
        
        const response = await fetch('api/manage-event-proposal.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        console.log('Delete Proposal Response:', {status: response.status, data: data});

        if (data.success) {
            alert('Proposal deleted successfully!');
            bootstrap.Modal.getInstance(document.getElementById('viewProposalModal')).hide();
            loadEventProposals();
        } else {
            showDebugError(
                `API returned success=false: ${data.message}`,
                'api/manage-event-proposal.php',
                payload,
                {status: response.status, data: data}
            );
        }
    } catch (error) {
        console.error('Error:', error);
        showDebugError(
            `Network/Parse Error: ${error.message}`,
            'api/manage-event-proposal.php',
            {action: 'delete', proposalId: parseInt(proposalId)},
            {error: error.toString(), stack: error.stack}
        );
    }
};

// Wrap deleteEvent with enhanced error handling
const originalDeleteEvent = window.deleteEvent;
window.deleteEvent = async function(eventId, eventTitle) {
    if (!confirm(`Are you sure you want to delete the event "${eventTitle}"? This action cannot be undone.`)) {
        return;
    }

    try {
        const payload = {
            action: 'delete',
            eventId: eventId
        };
        
        const response = await fetch('api/manage-event.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        console.log('Delete Event Response:', {status: response.status, data: data});

        if (data.success) {
            alert('Event deleted successfully!');
            loadEvents();
        } else {
            showDebugError(
                `API returned success=false: ${data.message}`,
                'api/manage-event.php',
                payload,
                {status: response.status, data: data}
            );
        }
    } catch (error) {
        console.error('Error:', error);
        showDebugError(
            `Network/Parse Error: ${error.message}`,
            'api/manage-event.php',
            {action: 'delete', eventId: eventId},
            {error: error.toString(), stack: error.stack}
        );
    }
};

// Wrap postponeEvent with enhanced error handling
const originalPostponeEvent = window.postponeEvent;
window.postponeEvent = async function(eventId) {
    if (!confirm('Are you sure you want to postpone this event? All registered members will be removed.')) {
        return;
    }

    try {
        const payload = {
            action: 'postpone',
            eventId: eventId
        };
        
        const response = await fetch('api/manage-event.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        console.log('Postpone Event Response:', {status: response.status, data: data});

        if (data.success) {
            alert('Event postponed successfully! All registered members have been removed. Delete button is now available.');
            const modal = bootstrap.Modal.getInstance(document.getElementById('editEventManagementModal'));
            if (modal) modal.hide();
            setTimeout(() => loadEvents(), 300);
        } else {
            showDebugError(
                `API returned success=false: ${data.message}`,
                'api/manage-event.php',
                payload,
                {status: response.status, data: data}
            );
        }
    } catch (error) {
        console.error('Error:', error);
        showDebugError(
            `Network/Parse Error: ${error.message}`,
            'api/manage-event.php',
            {action: 'postpone', eventId: eventId},
            {error: error.toString(), stack: error.stack}
        );
    }
};

console.log('Debug handlers installed for deleteProposal, deleteEvent, and postponeEvent');
</script>
