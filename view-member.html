<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reboot PH - Member Details</title>
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .member-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .member-header {
            background: linear-gradient(135deg, #035996 0%, #0A4FA3 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .member-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .member-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .member-position {
            font-size: 14px;
            opacity: 0.9;
        }

        .member-body {
            padding: 30px 20px;
        }

        .member-info {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .member-info:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .member-info-icon {
            color: #035996;
            font-size: 20px;
            margin-right: 15px;
            min-width: 30px;
        }

        .member-info-content {
            flex: 1;
        }

        .member-info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .member-info-value {
            font-size: 16px;
            color: #333;
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .error-icon {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .spinner-icon {
            font-size: 60px;
            color: #035996;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
        }

        .back-button i {
            color: #035996;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <button class="back-button" onclick="window.history.back()">
        <i class="bi bi-arrow-left"></i>
    </button>

    <div id="content">
        <div class="loading-spinner">
            <div class="spinner-icon">
                <i class="bi bi-hourglass-split"></i>
            </div>
            <p class="text-white">Loading member details...</p>
        </div>
    </div>

    <script>
        async function loadMemberDetails() {
            try {
                // Get member ID from URL parameter
                const urlParams = new URLSearchParams(window.location.search);
                const memberId = urlParams.get('id');

                if (!memberId) {
                    showError('Member ID is missing', 'Please scan a valid member ID QR code');
                    return;
                }

                // Fetch member data
                const response = await fetch(`api/get-member-by-id.php?id=${encodeURIComponent(memberId)}`);
                const result = await response.json();

                if (!result.success) {
                    showError('Member Not Found', result.message || 'The member ID could not be found in our database');
                    return;
                }

                displayMemberCard(result.data);

            } catch (error) {
                console.error('Error loading member details:', error);
                showError('Error Loading Member', 'An error occurred while loading member details. Please try again.');
            }
        }

        function displayMemberCard(member) {
            const statusClass = member.MembershipStatus === 'Active' ? 'status-active' : 'status-inactive';
            const joinDate = new Date(member.JoinDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const profileImage = member.ProfileImage ? `uploads/profile-images/${member.ProfileImage}` : 'assets/image/default-avatar.png';

            const html = `
                <div class="member-card">
                    <div class="member-header">
                        <img src="${profileImage}" alt="${member.FirstName} ${member.LastName}" class="member-avatar" onerror="this.src='assets/image/default-avatar.png'">
                        <div class="member-name">${member.FirstName} ${member.LastName}</div>
                        <div class="member-position">${member.Position || 'Member'}</div>
                    </div>

                    <div class="member-body">
                        <div class="member-info">
                            <div class="member-info-icon">
                                <i class="bi bi-card-text"></i>
                            </div>
                            <div class="member-info-content">
                                <div class="member-info-label">Member ID</div>
                                <div class="member-info-value">RPH-${member.MemberID.toString().padStart(7, '0')}</div>
                            </div>
                        </div>

                        <div class="member-info">
                            <div class="member-info-icon">
                                <i class="bi bi-envelope"></i>
                            </div>
                            <div class="member-info-content">
                                <div class="member-info-label">Email</div>
                                <div class="member-info-value">
                                    <a href="mailto:${member.EmailAddress}" style="color: #035996; text-decoration: none;">
                                        ${member.EmailAddress}
                                    </a>
                                </div>
                            </div>
                        </div>

                        ${member.PhoneNumber ? `
                        <div class="member-info">
                            <div class="member-info-icon">
                                <i class="bi bi-telephone"></i>
                            </div>
                            <div class="member-info-content">
                                <div class="member-info-label">Phone</div>
                                <div class="member-info-value">
                                    <a href="tel:${member.PhoneNumber}" style="color: #035996; text-decoration: none;">
                                        ${member.PhoneNumber}
                                    </a>
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        ${member.Organization ? `
                        <div class="member-info">
                            <div class="member-info-icon">
                                <i class="bi bi-building"></i>
                            </div>
                            <div class="member-info-content">
                                <div class="member-info-label">Organization</div>
                                <div class="member-info-value">${member.Organization}</div>
                            </div>
                        </div>
                        ` : ''}

                        <div class="member-info">
                            <div class="member-info-icon">
                                <i class="bi bi-calendar-check"></i>
                            </div>
                            <div class="member-info-content">
                                <div class="member-info-label">Member Since</div>
                                <div class="member-info-value">${joinDate}</div>
                            </div>
                        </div>

                        <div class="member-info">
                            <div class="member-info-icon">
                                <i class="bi bi-shield-check"></i>
                            </div>
                            <div class="member-info-content">
                                <div class="member-info-label">Status</div>
                                <div class="member-info-value">
                                    <span class="status-badge ${statusClass}">
                                        ${member.MembershipStatus}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        function showError(title, message) {
            const html = `
                <div class="member-card">
                    <div class="error-container">
                        <div class="error-icon">
                            <i class="bi bi-exclamation-circle"></i>
                        </div>
                        <div class="error-title">${title}</div>
                        <div class="error-message">${message}</div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        // Load member details when page loads
        loadMemberDetails();
    </script>
</body>

</html>
